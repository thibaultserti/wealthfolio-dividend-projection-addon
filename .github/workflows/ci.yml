name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  check-and-build:
    name: TypeCheck, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm run type-check

      - name: Run unit tests
        run: pnpm test

      - name: Package addon
        run: pnpm run package

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dividends-projection-addon
          path: dist/dividends-projection-addon.zip
          retention-days: 7
