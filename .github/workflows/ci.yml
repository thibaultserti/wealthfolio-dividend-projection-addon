name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  check-and-build:
    name: TypeCheck, Test & Build Monorepo
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check (all packages)
        run: pnpm run type-check

      - name: Run unit tests (all packages)
        run: pnpm test

      - name: Package addons (.zip)
        run: pnpm run package

      - name: Upload Dividends Projection Addon artifact
        uses: actions/upload-artifact@v7
        with:
          name: dividends-projection-addon
          path: packages/dividends-projection-addon/dist/dividends-projection-addon.zip
          retention-days: 7

      - name: Upload Portfolio Metrics Addon artifact
        uses: actions/upload-artifact@v7
        with:
          name: portfolio-metrics-addon
          path: packages/portfolio-metrics-addon/dist/portfolio-metrics-addon.zip
          retention-days: 7

      - name: Upload Monthly Performance Addon artifact
        uses: actions/upload-artifact@v7
        with:
          name: monthly-performance-addon
          path: packages/monthly-performance-addon/dist/monthly-performance-addon.zip
          retention-days: 7
